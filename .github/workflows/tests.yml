name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - run: ruff check .
      - run: ruff format --check .
      - run: basedpyright

  test-linux:
    name: Test on Linux, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # For the test that builds the Roslyn helper, which targets .NET 8.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - run: python -m pip install pytest

      - run: python -m pytest
        env:
          PYTHONPATH: src

  test-other:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install pytest

      - run: python -m pytest -m "not dotnet"
        env:
          PYTHONPATH: src
